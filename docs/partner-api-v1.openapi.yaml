components:
  securitySchemes:
    PartnerApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Api-Key <key>; scopes are server-side capabilities.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Retained exactly 24 hours per partner and endpoint. A matching replay returns Idempotent-Replay:
        true; a different body returns 409.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional caller-generated support correlation value; echoed when supplied.
      schema:
        type: string
        maxLength: 128
    QuoteId:
      name: quote_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentMethodId:
      name: payment_method_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindId:
      name: bind_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookEndpointId:
      name: webhook_endpoint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema:
        type: string
      description: ETag from a previous response for the same options or breed-list resource/location.
    State:
      name: state
      in: query
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z]{2}$
      description: Two-letter US postal abbreviation. Exactly one of state or postal_code is required.
    PostalCode:
      name: postal_code
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]{5}$
      description: Valid US ZIP code. Exactly one of state or postal_code is required.
  headers:
    ETag:
      description: Content-derived quote-input rules revision
      schema:
        type: string
    CacheControl:
      description: Partner cache policy
      schema:
        type: string
    RequestId:
      description: Rainwalk request identifier
      schema:
        type: string
    CorrelationId:
      description: Echo of a supplied X-Correlation-Id
      schema:
        type: string
        maxLength: 128
    RateLimitLimit:
      description: Partner bucket capacity for this request class
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining partner-bucket requests in this window
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Unix timestamp for the rate-limit window reset
      schema:
        type: integer
    RetryAfter:
      description: Seconds until retry; supplied on 429 responses
      schema:
        type: integer
        minimum: 1
    IdempotentReplay:
      description: true when the original response is replayed; GET the resource for current state.
      schema:
        type: string
        enum:
        - 'true'
  responses:
    Error:
      description: Error envelope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Status:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          - partner_id
          properties:
            status:
              type: string
              enum:
              - ready
            partner_id:
              type: string
              format: uuid
    QuoteCreateRequest:
      type: object
      required:
      - policyholder
      - pet
      - coverage_preferences
