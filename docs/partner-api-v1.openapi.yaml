                  type: string
                  enum:
                  - string
                format:
                  type: string
                  enum:
                  - date
        policyholder:
          type: object
          required:
          - address
          properties:
            address:
              type: object
              required:
              - state
              properties:
                state:
                  $ref: '#/components/schemas/StringChoices'
    MaskedPaymentDisplay:
      type: object
      properties:
        brand:
          type: string
        last4:
          type: string
          pattern: ^[0-9]{4}$
      description: Optional masked card metadata. May be empty; bank references currently return no card display
        fields.
    Consent:
      type: object
      required:
      - accepted_at
      - terms_version
      properties:
        accepted_at:
          type: string
          format: date-time
        terms_version:
          type: string
          minLength: 1
          description: Consent/policy terms version agreed during onboarding.
        ip_address:
          type: string
          description: Optional IP collected only where lawful.
    BindPayment:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - approved
          - pending_verification
          - rejected
          description: Approval status of the stored payment-method reference; this is not the charge outcome.
        attempt_id:
          type: string
          format: uuid
        attempt_status:
          type: string
          enum:
          - pending
          - processing
          - succeeded
          - failed
          description: Authoritative payment-attempt state when present.
        failure_code:
          type:
          - string
          - 'null'
          description: Safe reason for a failed attempt; null when no failure is recorded.
      description: Attempt fields are present when the bind has a payment attempt. A reference can remain approved
        even if its charge fails.
    BindPolicy:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: Current policy status normalized to lower snake case; retrieve /policies/{id} for full
            policy details.
    BindData:
      type: object
      required:
      - id
      - status
      - quote_id
      - plan_selection_id
      - payment
      - policy
      - created_at
      properties:
        simulated:
          type: boolean
          description: True only for sandbox simulator resources; no real funds or insurance coverage.
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - processing
          - bound
          - declined
          - payment_failed
          - cancelled
        quote_id:
          type: string
          format: uuid
        plan_selection_id:
          type: string
          format: uuid
        payment:
          $ref: '#/components/schemas/BindPayment'
        policy:
          anyOf:
          - $ref: '#/components/schemas/BindPolicy'
          - type: 'null'
        created_at:
          type: string
          format: date-time
    PolicyBilling:
      type: object
      required:
      - status
      - amount
      - currency
      - billing_source
      - next_payment_at
      properties:
        status:
          type: string
          description: Subscription state, currently pending, active, suspended, cancelled, or inactive.
        amount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        currency:
          type: string
          enum:
          - USD
        billing_source:
          type: string
          description: Provider/source label in lower case, currently stripe, oneinc, franpos, or unknown.
        next_payment_at:
          type:
          - string
          - 'null'
          format: date-time
      description: Latest active subscription summary. Amount is its recorded subscription amount, not a receipt
        or total-charge guarantee.
    WebhookEventType:
      type: string
      enum:
      - bind.processing
      - bind.bound
      - bind.declined
      - payment.succeeded
      - payment.failed
      - policy.issued
      - policy.status_changed
    WebhookEndpointUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Publicly resolvable HTTPS URL without embedded credentials; redirects are not followed.
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
        enabled:
          type: boolean
      example:
        enabled: false
    WebhookEventData:
      type: object
      properties:
        bind_id:
          type: string
          format: uuid
        payment_attempt_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        status:
          type: string
        failure_code:
          type: string
        provider_reference:
          type: string
          description: Opaque provider transaction reference; never treat its presence as proof of settlement.
      description: Fields depend on the event type. Treat as a notification and retrieve the referenced bind/policy.
        New fields may be added.
    WebhookEvent:
      type: object
      required:
      - id
      - type
      - occurred_at
      - api_version
      - data
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/WebhookEventType'
        occurred_at:
          type: string
          format: date-time
        api_version:
          type: string
          enum:
          - v1
        data:
          $ref: '#/components/schemas/WebhookEventData'
      example:
        id: 88888888-8888-4888-8888-888888888888
        type: bind.bound
        occurred_at: '2026-11-16T18:00:03Z'
        api_version: v1
        data:
          bind_id: 55555555-5555-4555-8555-555555555555
          policy_id: 77777777-7777-4777-8777-777777777777
          status: bound
webhooks:
  partnerEvent:
    post:
      summary: Rainwalk event delivered to your registered HTTPS endpoint
      description: Verify HMAC-SHA256 over timestamp + dot + unaltered body; reject timestamps outside five
        minutes, deduplicate event IDs, and acknowledge within 10 seconds. See receiver guide.
      parameters:
      - name: X-Rainwalk-Event-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Rainwalk-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: X-Rainwalk-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^v1=[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Event durably accepted or valid duplicate acknowledged.
      security: []
