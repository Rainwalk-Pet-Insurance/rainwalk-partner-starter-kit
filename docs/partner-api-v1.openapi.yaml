openapi: 3.1.0
info:
  title: Rainwalk Partner API v1
  version: 1.0.0
  description: |
    ## Partner API v1

    Sandbox access and production activation require separate onboarding and
    approval; this reference
    is not a production certification or service-level commitment.

    Rainwalk provides a server-to-server HTTP API for partners building their own
    quote and checkout experience. The purchase journey is quote → select plan →
    register an approved payment reference → bind → retrieve policy and payment status.
    Rainwalk owns eligibility, pricing, payment decisions, and policy state.

    ### Environments and access

    - Production API: https://api.rainwalk.io/partner/v1
    - Sandbox API: https://dev.api.rainwalk.io/partner/v1
    - Readable reference: https://api.rainwalk.io/api/schema/redoc/partner/v1
    - Downloadable OpenAPI: https://api.rainwalk.io/api/schema/partner/v1

    Reading this documentation requires no API key. Calling the API requires an
    approved partner, an environment-specific credential, enabled rollout access,
    and the capability named on each operation. Send `Authorization: Api-Key <key>`
    over HTTPS from your server. Never embed credentials in browser or mobile code.
    A capability is a Rainwalk-managed permission, not an OAuth scope requested by
    the caller. Resources belonging to another partner behave as absent.

    Arrange sandbox access, approved scopes, test payment-provider configuration,
    and a security/integration contact with your Rainwalk partnership contact.
    Use synthetic customer data and provider test-mode references in the sandbox.
    Production access is a separate activation after integration certification.
    Rotate credentials through your Rainwalk onboarding contact or approved partner
    portal workflow; store keys in a server-side secret manager. A replacement may
    overlap briefly with the old key, which must then be revoked.

    ### Scope and limitations

    Supported: quote options and breeds, quotes and 30-day price offers, plan
    selection, approved Stripe payment references, asynchronous binds, policy and
    billing summaries, and partner-owned webhook configuration.

    Claims API access requires a separate application.

    Not provided in v1: policy cancellation or changes, renewal requests, refunds,
    payouts, document downloads/uploads, claim adjudication/status writes, raw card
    or bank-data ingestion, or partner-supplied prices/payment outcomes. Legacy
    `/partner/...` APIs have a separate contract and are not rewritten to v1.

    ### Quickstart

    All examples use synthetic data and illustrative UUIDs. Prices and dates are
    examples, not offers. Replace response identifiers with the actual values
    returned in your environment. Every POST, PATCH, and DELETE requires its own
    `Idempotency-Key`, retained for 24 hours per partner and endpoint. Also send
    `Content-Type: application/json` when a body is present and optionally
    `X-Correlation-Id` for your own support trace.

    #### 1. Load form choices

    Call `GET /quote-inputs` and
    `GET /breed-lists?postal_code=78701`. Use the returned selectable values and
    canonical breed names. Supply both a supported address state and its matching
    ZIP in quote requests; do not rely on ZIP-only inference. Cache each response for up to 24 hours, then revalidate
    its ETag using `If-None-Match`; `304` means reuse the cached body. These lists
    help build forms and do not guarantee eligibility or price. An uncovered
    location returns empty breed lists with `coverage_status: uncovered`.
    #### 2. Create a quote

    POST the following body to `/quotes` with a new
    idempotency key. The response contains `data.id` and `data.offers[]`.

    ```json
    {"policyholder":{"first_name":"Ava","last_name":"Ng","email":"ava@example.test","phone":"2125550123","address":{"line1":"1 Main St","line2":"","city":"Austin","state":"TX","postal_code":"78701"}},"pet":{"name":"Mochi","species":"dog","breed":"Mixed Breed","birth_date":"2022-05-14","sex":"female","spayed_or_neutered":true},"coverage_preferences":{"annual_limit":15000,"deductible":500,"reimbursement_percent":80}}
    ```

    Choose a breed actually returned for the selected state. Supply the real pet
    birth date; future dates and unsupported rating ages are rejected. A legacy
    `pet_age` input remains supported, but birth date allows accurate re-rating.
    `external_customer_id` is not currently persisted or returned by quote creation;
    keep your customer-to-quote mapping in your system.
    #### 3. Select a plan

    POST
    `{"offer_id":"22222222-2222-4222-8222-222222222222","billing_frequency":"monthly"}`
    to `/quotes/{quote_id}/plan-selections`. Save `data.id`. Each offer locks its
    price for 30 days; the quote remains retrievable afterwards. Refresh an
    unbound quote with `POST /quotes/{quote_id}/offers` and `{}` if your account
    has the separate refresh capability. Older selections retain their prices.
    #### 4. Register a payment reference

    Stripe processing requires explicit Rainwalk approval for your partner.
    Tokenize directly with the approved Stripe
    integration under the account configuration agreed during onboarding. Complete
    any customer authentication in the approved provider-hosted flow. POST to
    `/payment-methods`:

    ```json
    {"provider":"stripe","provider_account_reference":"approved-account-reference","provider_customer_reference":"cus_example","provider_payment_method_reference":"pm_example","type":"card"}
    ```

    Never send PAN, CVV, bank-account/routing data, a client secret, or an assertion
    that a payment settled. Only the configured Stripe partner-token integration
    currently has an execution adapter; other providers/modes are not certified
    by this reference. Registration returns `201`, usually with
    `status: pending_verification`. Poll `GET /payment-methods/{id}` with backoff
    until `approved` or `rejected`; do not bind a pending/rejected method.
    Approval verifies the reference, not that the future charge will succeed.
    #### Sandbox simulator

    Authenticated, authorized sandbox partners can complete this journey without Stripe
    using `provider: sandbox_simulator`, `provider_account_reference: rw_sim_account`,
    `provider_customer_reference: rw_sim_customer`, `type: card`, and one of
    `rw_sim_success`, `rw_sim_decline`, `rw_sim_pending`, or `rw_sim_rejected` as the
    payment-method reference. The scenarios simulate success, charge decline,
    processing followed by success, or reference rejection. Registration verifies
    these references synchronously; pending charge simulation completes through
    the normal payment execution/reconciliation workers.

    Simulation is available by default to active sandbox partners with the normal
    v1 credentials, rollout access and required capabilities. No simulator opt-in
    is required. Production rejects simulation regardless of partner config.
    Stripe operations instead require separate Rainwalk approval for that partner
    in addition to provider/account configuration. The reference app defaults to
    the simulator. Results include `simulated: true`, policies remain `test_policy`,
    and billing is simulated/inactive. No actual charge, recurring billing,
    document, email, or webhook delivery is performed.

    #### 5. Request binding

    POST the identifiers and the customer's actual consent
    record to `/binds` with a new idempotency key:

    ```json
    {"quote_id":"11111111-1111-4111-8111-111111111111","plan_selection_id":"33333333-3333-4333-8333-333333333333","payment_method_id":"44444444-4444-4444-8444-444444444444","consent":{"accepted_at":"2026-11-16T18:00:00Z","terms_version":"version-agreed-during-onboarding"}}
    ```

    The current implementation responds `202` and processes payment asynchronously:

    ```json
    {"data":{"id":"55555555-5555-4555-8555-555555555555","status":"processing","quote_id":"11111111-1111-4111-8111-111111111111","plan_selection_id":"33333333-3333-4333-8333-333333333333","payment":{"status":"approved","attempt_id":"66666666-6666-4666-8666-666666666666","attempt_status":"pending","failure_code":null},"policy":{"id":"77777777-7777-4777-8777-777777777777","status":"payment_pending"},"created_at":"2026-11-16T18:00:01Z"}}
    ```

    #### 6. Retrieve the outcome

    Poll `GET /binds/{id}` with backoff or receive a
    webhook and retrieve the bind. `payment.status` describes reference approval;
    `payment.attempt_status` describes the charge. A successful result has
    `status: bound` and `payment.attempt_status: succeeded`. A failed charge has
    `status: payment_failed`, `payment.attempt_status: failed`, and a safe
    `failure_code`. `processing` is non-terminal, including unknown provider
    outcomes. Do not represent a pending policy as active coverage. Retrieve
    `GET /policies/{policy_id}` for policy number, effective date, coverage, and
    billing summary; issued/effective values are calendar dates, not timestamps.
    A policy can be issued before its effective date.

    ### Errors, retries, and tracing

    Errors use `{ "error": { "code": "...", "message": "...", "request_id": "..." } }`.
    Optional `details` may be a field-error object or a list of field details.
    Save the `X-Request-Id` response header for support; `X-Correlation-Id` is echoed
    when supplied. Do not log credentials or payment references.

    | Outcome | Client action |
    | --- | --- |
    | `400` malformed input/cursor | Correct the request; use a fresh key for a changed mutation body. |
    | `401` invalid/expired/revoked key | Check the environment and credential; arrange rotation if needed. |
    | `403` capability or rollout denied | Confirm access with Rainwalk; retrying does not grant permission. |
    | `404` missing resource | Check the identifier and environment; foreign-partner resources are hidden. |
    | `409 idempotency_key_reused` | The key was used with different bytes; never change a request under an existing key. |
    | `409 request_in_progress` | Wait, then replay the identical request with the same key. |
    | `409 selection_conflict` / `bind_conflict` | Retrieve existing state before attempting a new purchase; do not blindly retry. |
    | `422 validation_error` / `offer_expired` | Correct input or refresh/select an eligible offer; use a new key for a new request. |
    | `422 payment_method_not_approved` | Retrieve the method and wait for approval or resolve rejection. |
    | `429` | Wait for `Retry-After`; retain the original mutation key and body. |
    | `5xx` or network timeout | Back off and check known resources; replay exact bytes with the same key within the retention window. Contact Rainwalk for unresolved outcomes. |

    An identical replay returns the original HTTP status and body with
    `Idempotent-Replay: true`; that body is a snapshot, not the latest state.
    GET the resource to observe changes. Do not generate a new key merely because
    a response was lost. After 24 hours the key may be treated as new: reconcile
    with Rainwalk before retrying an ambiguous purchase outside that window.

    Safe payment failure codes include `payment_method_declined`,
    `payment_method_expired`, `payment_authentication_required`,
    `payment_provider_not_approved`, `payment_reference_mismatch`, and
    `payment_not_completed`. A failed bind is terminal; coordinate recovery rather
    than submitting a second bind for the same quote. v1 never returns a processor
    client secret for an authentication challenge.

    Read and mutation requests use separate per-partner rate-limit buckets shared
    across v1 endpoints. Limits are environment-configurable; use `RateLimit-Limit`,
    `RateLimit-Remaining`, `RateLimit-Reset` (Unix seconds), and `Retry-After`
    (seconds). No specific throughput or processing-time SLA is promised here.

    ### Webhook receiver guide

    Create an HTTPS endpoint with `POST /webhook-endpoints`, for example:

    ```json
    {"url":"https://partner.example.test/rainwalk-events","event_types":["bind.processing","bind.bound","payment.succeeded","payment.failed","policy.issued"],"enabled":true}
    ```

    Replace the example URL with your publicly resolvable HTTPS receiver. Private,
    loopback, and link-local destinations are rejected. Configuration PATCH accepts
    partial changes; DELETE disables the endpoint. The signing secret is shared by
    your partner's endpoints and returned when first created. Store it securely;
    new-key replay responses may contain it, so protect those responses too.
    It is not retrievable through endpoint listing.

    Supported subscriptions: `bind.processing`, `bind.bound`, `bind.declined`,
    `payment.succeeded`, `payment.failed`, `policy.issued`, `policy.status_changed`.
    Event subscription support does not guarantee that every lifecycle change emits
    an event; use GET resources as authoritative. A notification has this envelope:

    ```json
    {"id":"88888888-8888-4888-8888-888888888888","type":"bind.bound","occurred_at":"2026-11-16T18:00:03Z","api_version":"v1","data":{"bind_id":"55555555-5555-4555-8555-555555555555","policy_id":"77777777-7777-4777-8777-777777777777","status":"bound"}}
    ```

    Verify signatures against the **unaltered raw request bytes**, before parsing:

    ```python
    import hashlib
    import hmac
    import time

    def valid_signature(raw_body, headers, signing_secret):
     try:
         timestamp = headers['X-Rainwalk-Timestamp']
         if abs(time.time() - int(timestamp)) > 300:
             return False
         signed = timestamp.encode('ascii') + b'.' + raw_body
         expected = 'v1=' + hmac.new(signing_secret.encode(), signed, hashlib.sha256).hexdigest()
         return hmac.compare_digest(expected, headers['X-Rainwalk-Signature'])
     except (KeyError, ValueError, UnicodeError, TypeError):
         return False
    ```

    Verify that `X-Rainwalk-Event-Id` matches the signed body's `id`, deduplicate on
    that event ID, durably accept/queue processing, and respond `2xx` within 10
    seconds. Acknowledge valid duplicates too. Delivery is at-least-once and may be
    out of order. Never assume arrival order implies policy/payment state.

    Network errors and non-2xx responses (including redirects) are retried. Current
    retry delays after failed attempts are 60, 300, 1800, 7200, 21600, and 43200
    seconds (approximately 20.6 hours cumulatively, plus execution time). There is
    no guaranteed delivery deadline; an invalidated destination can fail without
    further retries. Contact your Rainwalk integration contact for exhausted
    failures or signing-secret recovery. This API does not expose delivery history
    or a signing-key rotation endpoint.

    ### Versioning and support

    `/v1` identifies the major API version. Ignore new response fields and handle
    unknown status/event strings safely. Confirm your enabled capabilities and
    integration requirements during onboarding.
    For integration questions or an unresolved request, contact your assigned
    Rainwalk partnership/support contact with environment, endpoint, UTC time,
    request ID, and correlation ID. Exchange credentials only through the approved
    secure onboarding channel, never in email or support examples.
servers:
- url: https://api.rainwalk.io/partner/v1
  description: Production; separate activation required
- url: https://dev.api.rainwalk.io/partner/v1
  description: Sandbox / staging; approved test access required
security:
- PartnerApiKey: []
paths:
  /status:
    get:
      operationId: getStatus
      description: |-
        Authenticated readiness check for partner onboarding and integration diagnostics.

        Required capability: `partner.quote.read`.
      security:
      - PartnerApiKey: []
      responses:
        '200':
          description: Partner API ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      summary: Check partner access
  /quotes:
    get:
      operationId: listQuotes
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Partner-owned quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.read
      description: 'Required capability: `partner.quote.read`.'
      summary: List quotes
    post:
      operationId: createQuote
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '201':
          description: Quote offered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
        '422':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.create
      description: 'Required capability: `partner.quote.create`.'
      summary: Create a quote
  /quotes/{quote_id}:
    get:
      operationId: getQuote
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.read
      description: 'Required capability: `partner.quote.read`.'
      summary: Retrieve a quote
  /quotes/{quote_id}/offers:
    post:
      operationId: refreshQuoteOffer
      description: |-
        Re-rate the saved quote using current eligibility and pricing, issuing a
        new immutable offer valid for 30 days. Quotes and historical offers remain
        retrievable after expiry. Refresh is allowed before or after expiry, but
        not after any bind or policy exists. Existing selections keep their price.
        Send an empty object; partner-supplied prices and input edits are rejected.

        Required capability: `partner.quote.offer.refresh`.
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Quote with newest offer first and a fresh 30-day price lock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.offer.refresh
      summary: Refresh a quote offer
  /quote-inputs:
    get:
      operationId: getQuoteInputOptions
      description: |-
        Current form-safe quote constraints and selectable values. This is not an eligibility or price guarantee.

        Required capability: `partner.quote.read`.
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Quote form constraints
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteInputOptions'
        '304':
          description: Quote form constraints unchanged
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.read
      summary: Retrieve quote input options
  /breed-lists:
    get:
      operationId: getBreedLists
      description: |-
        Canonical state-level dog and cat breed lists for quote-form dropdowns. Provide exactly one of state or postal_code; a valid but uncovered state returns a cacheable empty list.

        Required capability: `partner.quote.read`.
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/State'
      - $ref: '#/components/parameters/PostalCode'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Breed reference data
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreedListOptions'
        '304':
          description: Breed reference data unchanged
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      x-required-capability: partner.quote.read
      summary: Retrieve breed lists
  /quotes/{quote_id}/plan-selections:
    post:
      operationId: selectPlan
      description: |-
        Select an unexpired active offer, or recover an existing immutable selection with the same billing frequency even after offer expiry. A different frequency conflicts.

        Required capability: `partner.quote.select_plan`.
      security:
      - PartnerApiKey: []
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSelectionRequest'
      responses:
        '201':
          description: Selected plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSelection'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
        '404':
          $ref: '#/components/responses/Error'
        '409':
